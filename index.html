<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>ASTRONEX</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#060b18;--hull:#0d1730;--line:#1c2b52;--cy:#4de1ff;--red:#ff4d5e;--am:#ffb347;--ok:#5ef0a8;--tx:#e6eefc;--mu:#8a9bc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 20% 0,#12214a,var(--ink) 60%);color:var(--tx);font:15px/1.5 "Chakra Petch",system-ui,sans-serif}
#app{display:flex;height:100%}
nav{width:210px;background:#080f22;border-right:1px solid var(--line);padding:14px 10px;overflow:auto;flex:none}
nav h1{font-size:17px;margin:4px 8px 14px;color:var(--cy);letter-spacing:.04em}
nav a{display:block;padding:8px 10px;border-radius:6px;color:var(--mu);cursor:pointer;margin-bottom:2px}
nav a.on,nav a:hover{background:var(--hull);color:var(--tx)}
main{flex:1;overflow:auto;padding:0 20px 30px}
.bar{position:sticky;top:0;z-index:5;background:#060b18ee;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px;font-size:13px;color:var(--mu)}
.bar b{color:var(--tx)}
h2{font-size:22px;margin:6px 0 14px;font-weight:600}h3{margin:0 0 6px;font-size:15px;font-weight:600}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.c{background:var(--hull);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.c.cl{cursor:pointer}.c.cl:hover{border-color:var(--cy)}
.big{font-size:30px;font-weight:600;line-height:1.1}.mu{color:var(--mu);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--cy);color:var(--cy);margin-right:4px}
.tag.s{border-color:var(--am);color:var(--am)}.tag.r{border-color:var(--red);color:var(--red)}.tag.o{border-color:var(--ok);color:var(--ok)}.tag.m{border-color:var(--mu);color:var(--mu)}
canvas{width:100%;height:70px;display:block;margin-top:6px}
button,select,input{font:inherit;background:#0a1228;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
button{cursor:pointer}button:hover{border-color:var(--cy)}button.red{border-color:var(--red);color:var(--red)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cy)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.alert{border-color:var(--red);box-shadow:0 0 18px #ff4d5e33}
#login{margin:12vh auto;max-width:360px;padding:0 16px}#login .c{display:grid;gap:10px}
textarea{width:100%;height:120px;background:#0a1228;color:var(--mu);border:1px solid var(--line);border-radius:6px}
li{margin:4px 0}svg text{fill:var(--tx);font-size:12px}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes fi{from{opacity:0;transform:translateY(8px)}}@keyframes fl{50%{transform:translateY(-10px) rotate(4deg)}}@keyframes ld{to{background-position-x:240px}}@keyframes dr{0%{transform:translate(-60px,0) rotate(0)}50%{transform:translate(50vw,-80px) rotate(180deg)}100%{transform:translate(105vw,0) rotate(360deg)}}
#deco{position:fixed;right:-120px;bottom:-120px;width:360px;height:360px;z-index:-1;pointer-events:none;opacity:.6}
.earth{position:absolute;inset:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#7fd6ff,#1b5fbf 45%,#0a2150 80%);box-shadow:0 0 60px #4de1ff66,inset -20px -20px 40px #000a}
.earth::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 30% 22% at 20% 40%,#3fae6a99 60%,#0000 62%),radial-gradient(ellipse 25% 30% at 70% 60%,#3fae6a99 60%,#0000 62%);background-size:240px 100%;background-repeat:repeat-x;animation:ld 25s linear infinite}
.orbit{position:absolute;inset:0;border:1px dashed #4de1ff44;border-radius:50%;animation:sp 14s linear infinite}.orbit span{position:absolute;top:-12px;left:50%;font-size:22px}
#astro{position:fixed;left:0;top:62%;font-size:32px;cursor:pointer;z-index:4;animation:dr 45s linear infinite;filter:drop-shadow(0 0 8px #4de1ff)}#astro:hover{animation-play-state:paused}
main.fade{animation:fi .4s}.c.cl{transition:transform .15s,border-color .15s}.c.cl:hover{transform:translateY(-3px)}button:active{transform:scale(.96)}
@media(prefers-reduced-motion:reduce){#astro,#deco *,main.fade{animation:none!important}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--hull);border:1px solid var(--cy);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}#toast.on{opacity:1}
@media(max-width:720px){nav{width:64px}nav a{font-size:0}nav a::first-letter{font-size:15px}nav h1{font-size:0}}
@media(prefers-reduced-motion:no-preference){.alert{animation:p 1.6s infinite}@keyframes p{50%{box-shadow:0 0 4px #ff4d5e22}}}
</style></head><body>
<canvas id="stars" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1"></canvas><div id="root"></div><div id="toast"></div><div id="deco" aria-hidden="true"><div class="earth"></div><div class="orbit"><span>🛰️</span></div></div><div id="astro" title="Click for a space fact" onclick="fact()">🧑‍🚀</div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const USERS=[['MC-ADMIN','Mission Control admin'],['MED-01','Authorized medical operator'],...A.map(a=>[a.id,'Astronaut'])];
const P=[['hr','Heart rate','BPM'],['pulse','Pulse rate','BPM'],['spo2','Blood oxygen (SpO₂)','%'],['bp','Blood pressure','mmHg'],['rr','Respiratory rate','br/min'],['temp','Body temperature','°C']];
const ENV=[['temp','Cabin temperature','°C',22,28],['hum','Cabin humidity','%',45,70],['pres','Cabin pressure','kPa',101.3,105],['co2','CO₂','ppm',800,1500],['o2','O₂','%',20.9,23],['rad','Radiation','µSv/h',.6,2]];
const NAV=[['dash','Mission Control'],['astro','Astronaut profile'],['health','Astronaut health'],['hist','History graphs'],['body','Body and health coach'],['env','Habitat environment'],['sim','Simulation center'],['cless','Contactless monitoring'],['twin','Digital twin'],['vr','VR cabin (3D)'],['earth','Space-Earth link'],['med','Medical checkup'],['crew','Crew roster'],['life','Life support'],['deck','Mission brief (deck)'],['guard','Health Guardians game'],['celes','CELESTIACLASH'],['ai','AI risk analysis'],['emg','Emergency response'],['nasa','NASA data hub'],['comms','Communication center'],['box','Black box and reports']];
const PROC={'Abnormal health readings':['Confirm sensors are attached and readings are valid','Notify crew medical officer','Acknowledge to Mission Control','Follow approved medical protocol (supplied by mission specialists)'],'Cabin environmental emergency':['Verify reading on a second sensor','Alert all crew','Follow approved cabin-air procedure (supplied by mission specialists)','Acknowledge to Mission Control'],def:['Identify the event','Notify crew and Mission Control','Follow approved procedure (supplied by mission specialists)','Acknowledge']};
const S={user:null,sessions:[],spin:true,obj:[0,0,0,0,0],snd:false,well:{sleep:7,fatigue:2},sys:{o2:1,scrub:1,water:1,power:1,therm:1},tgt:0,rel:'auto',sl:0,page:'dash',ai:0,param:null,mode:'sim',run:true,speed:1,scen:'normal',comms:'up',prof:'Earth',emg:null,log:[],audit:[],logins:[],alerts:[],q:[],sync:null,n:0,th:Object.fromEntries(ENV.map(e=>[e[0],e[4]])),consent:false,still:0};

const L=(t,m)=>{S.log.unshift({t:new Date().toISOString().slice(11,19),ty:t,m});S.log.length=Math.min(S.log.length,300)};
const rd=(m,s)=>+(m+(Math.random()-.5)*2*s);
const lastv=a=>a.length?a[a.length-1]:null;

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const HASH='';
let D=[];
function tick(){
 if(!S.sessions.length||!S.run)return;S.n++;
 A.forEach((a,i)=>{const h=H[i],bad=S.scen==='unusual'&&i===1,dis=S.scen==='disc'&&i===2,miss=S.scen==='missing';
  let v=S.mode==='real'?(window.LIVE&&window.LIVE[i]||{}):dis?{}:{hr:rd(72+i*3,3),pulse:rd(72+i*3,3),spo2:rd(97.5,1),bp:rd(118,4),dia:rd(78,3),rr:rd(15,1.5),temp:rd(36.7,.15)};
  if(bad&&!dis&&S.mode==='sim')v={hr:rd(138,3),pulse:rd(136,3),spo2:rd(88,1),bp:rd(150,4),dia:rd(95,3),rr:rd(27,1),temp:rd(37.8,.1)};
  for(const k in h){let x=v[k]??null;if(miss&&Math.random()<.3)x=null;h[k].push(x==null?null:+x.toFixed(1));if(h[k].length>60)h[k].shift()}});
 ENV.forEach(e=>{let v=S.mode==='real'?null:rd(e[3],e[0]==='pres'?.1:e[3]*.01);if(v!=null&&S.scen==='cabin'&&e[0]==='co2')v=Math.min(1200+S.n*60,4200);E[e[0]].push(v==null?null:+v.toFixed(e[0]==='co2'?0:1));if(E[e[0]].length>60)E[e[0]].shift()});
 const em=S.emg;
 if(S.comms==='up'&&S.q.length){L('SYNC',S.q.length+' queued items synchronized');S.sync=Date.now();S.q=[]}
 if(S.mode==='sim'&&!em){A.forEach((a,i)=>{if(risk(i).lv==='CRITICAL')startEmg('Abnormal health readings',i,'AI risk: critical')});if(lastv(E.co2)>S.th.co2*2)startEmg('Cabin environmental emergency',-1,'CO₂ above twice the warning threshold')}
 if(S.emg&&S.emg.open){if(S.comms==='up'){S.emg.earth=snap(S.emg.i);S.sync=Date.now()}else S.q.push(1);S.emg.stored++}
 A.forEach((a,i)=>{const r=risk(i);if(r.lv!==S.prev?.[i]){if(r.lv!=='NORMAL')S.alerts.unshift({t:new Date().toISOString().slice(11,19),a:a.id,lv:r.lv,why:r.why.join('; ')});S.prev=S.prev||[];S.prev[i]=r.lv}});
 if(S.n%30===0)pushHist();linkTick();if(S.user&&!PDN&&S.page!=='guard'&&S.page!=='celes'&&((S.page!=='vr'&&S.page!=='earth')||S.n%3===0))render()}
function risk(i){const h=H[i],g=k=>lastv(h[k]),w=[];let lv='NORMAL';
 if(Object.values(h).every(a=>lastv(a)==null))return{lv:'NORMAL',why:['No usable data: sensors unavailable (not rated)'],na:true};
 const up=l=>{if(l==='CRITICAL'||lv==='NORMAL')lv=l};
 if(g('hr')>130){w.push('Heart rate far above range');up('CRITICAL')}else if(g('hr')>110){w.push('Heart rate above range');up('WARNING')}
 if(g('spo2')!=null&&g('spo2')<90){w.push('SpO₂ well below range');up('CRITICAL')}else if(g('spo2')<94&&g('spo2')!=null){w.push('SpO₂ below range');up('WARNING')}
 if(g('rr')>24){w.push('Respiratory rate high');up('WARNING')}if(g('temp')>38.5){w.push('Temperature high');up('CRITICAL')}
 if(lastv(E.co2)>S.th.co2){w.push('Cabin CO₂ above threshold (combined factor)');up('WARNING')}
 const nulls=h.hr.slice(-10).filter(x=>x==null).length;if(nulls>3){w.push('Unreliable data: '+nulls+' of last 10 readings missing');up('WARNING')}
 return{lv,why:w.length?w:['All available readings within configured ranges']}}
function snap(i){const o={t:Date.now(),v:{}};if(i>=0)for(const k in H[i])o.v[k]=lastv(H[i][k]);return o}
function startEmg(type,i,why){const id='EMG-'+Date.now().toString(36).toUpperCase();
 S.emg={id,type,i,open:true,start:Date.now(),why,tl:[[now(),'Event detected: '+why],[now(),'Sensor source verified: '+(S.mode==='sim'?'SIMULATED':'REAL')]],chk:(PROC[type]||PROC.def).map(t=>[t,false]),earth:S.comms==='up'?snap(i):null,stored:1,ack:false,sev:type.startsWith('Cabin')?'CRITICAL':'CRITICAL'};
 if(i>=0)S.audit.unshift({t:now(),who:'emergency-access process',a:A[i].id,sc:'latest vitals only',ev:id});
 L('EMERGENCY',id+' '+type);if(S.snd)beep();toast('EMERGENCY '+id);S.page='emg';if(S.comms==='down'){S.q.push(1)}}
const now=()=>new Date().toISOString().slice(11,19);
function spark(cv,arr,col,mn,mx){const c=cv.getContext('2d'),w=cv.width=cv.clientWidth*2,h=cv.height=cv.clientHeight*2;c.strokeStyle=col;c.lineWidth=2.5;c.beginPath();let pen=false;const v=arr.filter(x=>x!=null);mn=mn??Math.min(...v,0);mx=mx??Math.max(...v,1);arr.forEach((x,k)=>{if(x==null){pen=false;return}const X=k/(arr.length-1||1)*w,Y=h-6-(x-mn)/(mx-mn||1)*(h-12);pen?c.lineTo(X,Y):c.moveTo(X,Y);pen=true});c.stroke()}
function ecgv(t){const p=t%1;const g=(m,s,a)=>a*Math.exp(-((p-m)**2)/(2*s*s));return g(.2,.03,.15)-g(.34,.012,.15)+g(.37,.012,1)-g(.4,.012,.25)+g(.62,.05,.25)}
function ecgDraw(){const cv=$('#ecg');if(!cv)return;const i=S.ai,c=cv.getContext('2d'),w=cv.width=cv.clientWidth*2,h=cv.height=cv.clientHeight*2;if(lastv(H[i].hr)==null){c.fillStyle='#8a9bc4';c.font='24px sans-serif';c.fillText('UNAVAILABLE: no ECG signal',20,h/2);return}c.strokeStyle='#5ef0a8';c.lineWidth=2.5;c.beginPath();const hz=lastv(H[i].hr)/60,t0=Date.now()/1000;for(let x=0;x<w;x++){const t=t0-(w-x)/w*3;const y=h*.75-ecgv(t*hz)*h*.6;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
setInterval(ecgDraw,100);
const lab=()=>S.mode==='sim'?'<span class="tag s">SIMULATED</span>':'<span class="tag o">REAL SENSOR</span>';
function st(a){const v=lastv(a);return v==null?'<span class="tag m">UNAVAILABLE</span>':'<span class="tag o">LIVE</span>'}
function fmt(i,k){const h=H[i];if(k==='bp'){const s=lastv(h.bp),d=lastv(h.dia);return s==null?'—':Math.round(s)+'/'+Math.round(d)}const v=lastv(h[k]);return v==null?'—':v}
function conn(i){const miss=H[i].hr.slice(-5).every(x=>x==null);return S.mode==='real'?(window.LIVE&&window.LIVE[i]?'Connected (real sensor)':'No device connected (waiting for POST /api/sensor)'):miss?'Sensor disconnected or no data':'Connected (virtual)'}
const pages={
dash(){const cn=A.filter((a,i)=>H[i].hr.slice(-3).some(x=>x!=null)).length,rs=A.map((a,i)=>risk(i).lv);
 return`<h2>Earth Mission Control</h2><div class="row"><button onclick="go('vr')">🪐 Open VR cabin</button><button onclick="S.scen='unusual';S.mode='sim';S.n=0;L('SCENARIO','Unusual readings');toast('Unusual readings scenario started');render()">⚠️ Run unusual scenario</button><button onclick="go('guard')">🎮 Play Health Guardians</button><button onclick="go('deck')">🎞️ Mission brief</button><button onclick="launch()">🚀 Launch sequence</button><button onclick="go('cless')">📷 Camera monitoring</button><button class="red" onclick="startEmg('Manual SOS request',S.ai,'Manual SOS request')">🆘 Send SOS</button><button onclick="S.comms=S.comms==='up'?'down':'up';L('COMMS','Link '+S.comms);toast('Comms '+S.comms);render()">📡 Toggle comms</button></div><div class="g">
 ${[['Astronauts',A.length],['Active missions',1],['Connected',cn],['Disconnected',A.length-cn],['Real sensors',S.mode==='real'?Object.keys(window.LIVE||{}).length+' connected':'Mode off'],['Virtual simulation',S.mode==='sim'?(S.run?'Running':'Paused'):'Off'],['Active emergencies',S.emg&&S.emg.open?1:0],['Communication',S.comms==='up'?'Up ('+S.prof+')':'Outage']].map((x,k)=>`<div class="c cl" onclick="go(['crew','twin','astro','health','sim','sim','emg','comms'][${k}])"><div class="mu">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div>
 ${(D.push(dashCharts),'')}<div class="g2" style="margin:14px 0"><div class="c cl" onclick="go('ai')"><h3>Mission health index</h3><canvas id="hix" style="height:150px"></canvas><div class="mu">Click to open AI risk analysis. 100 is best. Lowers with crew risk flags, missing data and cabin alerts. ${lab()}</div></div><div class="c cl" onclick="S.hp='hr';go('hist')"><h3>Crew heart rate (live)</h3><canvas id="chr" style="height:150px"></canvas><div class="mu">${A.map((a,i)=>`<span style="color:${COLS[i]}">● ${a.id}</span>`).join(' ')} · <a style="color:var(--cy);cursor:pointer" onclick="go('hist')">Open history graphs</a></div></div></div><div class="g">${ENV.slice(0,4).map(e=>`<div class="c cl" onclick="go('env')"><div class="mu">${e[1]}</div><div class="big">${lastv(E[e[0]])??'—'} <span class="mu">${e[2]}</span></div><canvas id="de_${e[0]}"></canvas></div>`).join('')}</div><h3 style="margin-top:18px">Astronauts</h3><div class="g">${A.map((a,i)=>{const r=risk(i);return`<div class="c cl ${r.lv==='CRITICAL'?'alert':''}" onclick="S.ai=${i};go('astro')"><h3>${a.n}</h3><div class="mu">${a.id}</div><p>${can(i)?`HR ${fmt(i,'hr')} · SpO₂ ${fmt(i,'spo2')} · BP ${fmt(i,'bp')}`:'Restricted'}</p><div class="row"><button onclick="event.stopPropagation();S.ai=${i};go('health')">Live</button><button onclick="event.stopPropagation();S.ai=${i};go('hist')">History</button><button onclick="event.stopPropagation();S.ai=${i};S.chk=null;go('med')">Checkup</button></div>${lab()}<span class="tag ${r.lv==='NORMAL'?'o':r.lv==='WARNING'?'s':'r'}">${r.na?'NO DATA':r.lv}</span></div>`}).join('')}</div>

health(){const i=S.ai,a=A[i];if(!can(i))return'<h2>Access denied</h2><p>Your role cannot view this astronaut.</p>';
 const tabs=S.user.role==='Astronaut'?'':`<div class="row">${A.map((x,k)=>`<button onclick="S.ai=${k};S.param=null;render()" ${k===i?'style="border-color:var(--cy)"':''}>${x.id}</button>`).join('')}</div>`;

earth(){D.push(initEarth);const ok=los(),rx=T2.rx;return`<h2>Space to Earth link</h2><p class="mu">Prototype: station telemetry reaches the Earth research centre when there is line of sight. Data collected while blocked is queued and sent later. Drag to rotate, scroll to zoom.</p><div class="row"><button onclick="S.spin=!S.spin;render()">${S.spin?'Stop':'Start'} Earth rotation</button><button onclick="S.comms=S.comms==='up'?'down':'up';L('COMMS','Link '+S.comms);render()">${S.comms==='up'?'Simulate outage':'Restore link'}</button></div><div class="g2"><div class="c" style="padding:0;overflow:hidden"><div id="e3" style="height:420px;touch-action:none"></div></div><div class="c"><h3>🔬 Earth research centre</h3><span class="tag ${ok?'o':'r'}">${S.comms==='down'?'OUTAGE':ok?'LINK LIVE':'NO LINE OF SIGHT'}</span><div class="mu">Packets received: ${T2.pk||0} · Queued on station: ${T2.qn||0}</div><table><tr><th>ID</th><th>HR</th><th>SpO₂</th><th>BP</th><th>Temp</th><th>Data</th></tr>${A.map((a,i)=>{const v=rx&&rx[i].v;return`<tr><td>${a.id}</td><td>${v?v.hr??'—':'—'}</td><td>${v?v.spo2??'—':'—'}</td><td>${v&&v.bp!=null?Math.round(v.bp)+'/'+Math.round(v.dia):'—'}</td><td>${v?v.temp??'—':'—'}</td><td>${!rx?'<span class="tag m">OFFLINE</span>':ok?'<span class="tag o">LIVE</span>':'<span class="tag s">DELAYED '+T2.rxt+'</span>'}</td></tr>`}).join('')}</table><p class="mu">Red pin: Earth research centre. Blue panels: space station. ${lab()} Decision support only.</p></div></div>`},

const VT=(k,i)=>{const g=x=>lastv(H[i][x]);if(k==='bp')return g('bp')==null?'no data':Math.round(g('bp'))+'/'+Math.round(g('dia'))+' mmHg';if(k==='fat')return S.well.sleep+' h sleep, fatigue '+S.well.fatigue+'/5';const v=g(k);return v==null?'no data':v+({hr:' BPM',spo2:' %',temp:' °C'})[k]};
const EN=[['Space station (microgravity)',0,null,'Radiation: roughly 0.5 mSv a day, protected a little by Earth’s magnetic field (as far as I know).',['Fluid check: note head fullness and vision',10]],['Spacecraft in transit (microgravity)',0,null,'Radiation: about 1.8 mSv a day in deep space (Curiosity RAD measurement on the way to Mars).',['Radiation shelter drill',15]],['Moon base (0.165 g)',.165,['Dust and low gravity can disturb balance. The Moon night lasts about 14 Earth days, so keep a fixed sleep routine.','With 1/6 gravity the heart has an easier job than on Earth and can weaken. Walk, run and do resistance work every day.','Moon dust is sharp and irritates lungs and eyes. Keep dust out of the cabin and check the air filters.','Less fluid shift than in orbit, but standing up after a long rest can still make you dizzy.','Low gravity alone does not keep bones and muscles strong. Plan daily strength exercise.'],'Radiation: about 1.4 mSv a day on the surface (Chang’e-4 measurement). Use shelter during solar storms.',['Brush dust off the suit and check your eyes',10]],['Mars rover or base (0.38 g)',.38,['Long isolation and a 3 to 22 minute message delay add stress. Keep a routine and talk with the crew.','1/3 gravity is better than the Moon, but the heart still works less than on Earth. Keep up cardio exercise.','Mars dust contains chemicals that can irritate lungs. Keep suits and filters clean and watch cabin CO₂.','Blood moves down a little more than in orbit, which helps. Still check blood pressure after long rests.','About 1/3 gravity helps, but bones and muscles still weaken on a long stay. Exercise daily, eat enough protein and vitamin D.'],'Radiation: about 0.7 mSv a day on the surface (Curiosity RAD measurement). Plan shelter time.',['Log radiation dose and message delay',10]]];

 for(let k=0;k<=4;k++){const y=pt+(Hh-pt-pb)*k/4;c.strokeStyle='#1c2b52';c.beginPath();c.moveTo(pl,y);c.lineTo(W-pr,y);c.stroke();c.fillStyle='#8a9bc4';c.textAlign='left';c.fillText((mx-(mx-mn)*k/4).toFixed(mx-mn<10?1:0),4,y+7)}

 $('#root').innerHTML=`<div id="app"><nav><h1>ASTRONEX</h1>${NAV.filter(n=>S.user.role!=='Astronaut'||['dash','health','hist','body','med','deck','guard','celes','emg'].includes(n[0])).map(n=>`<a tabindex="0" class="${S.page===n[0]?'on':''}" onclick="go('${n[0]}')">${IC[n[0]]||''} ${n[1]}</a>`).join('')}</nav><main class="${S.fade?'fade':''}"><div class="bar"><span><b>${new Date().toISOString().slice(0,19).replace('T',' ')} UTC</b></span><span>Mission: Habitat Alpha</span><span>MET ${met()}</span><span class="tag" style="cursor:pointer" onclick="S.snd=!S.snd;if(S.snd)beep();toast('Alert sound '+(S.snd?'on':'off'));render()">🔔 ${S.snd?'ON':'OFF'}</span><span>Public view · simulated data</span><span class="mu">Astronaut:</span>${A.map((a,i)=>`<span class="tag ${i===S.ai?'o':'m'}" style="cursor:pointer" onclick="S.ai=${i};S.chk=null;render()">${a.id}</span>`).join('')}${S.sessions.length>1?'<span class="mu">Switch to:</span>'+S.sessions.map(s=>`<span class="tag ${s.id===S.user.id?'o':'m'}" style="cursor:pointer" onclick="swap('${s.id}')">${s.id}</span>`).join(''):''}${lab()}<span class="tag ${S.comms==='up'?'o':'r'}">COMMS ${S.comms==='up'?'UP':'OUTAGE'}</span>${em?`<span class="tag r" style="cursor:pointer" onclick="go('emg')">EMERGENCY ${S.emg.id}</span>`:''}<span class="mu">Prototype with simulated data</span></div>${body}</main></div>`;D.forEach(f=>f());ecgDraw();S.fade=0}
function loginView(){$('#root').innerHTML=`<div id="login"><div style="font-size:56px;animation:fl 4s ease-in-out infinite">🧑‍🚀</div><h1 style="color:var(--cy)">ASTRONEX</h1><p class="mu">Monitor the habitat. Understand the astronaut. Predict the risk. Respond without delay.</p><p class="mu" id="lt">Login time: ${new Date().toLocaleString()}</p><div class="c"><label>Account<br><select id="u" style="width:100%" onchange="hint()">${USERS.map(u=>`<option value="${u[0]}">${u[0]} · ${u[1]}</option>`).join('')}</select></label><label>Password<br><input id="p" type="password" style="width:100%" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')login()"></label><button onclick="login()">Sign in</button><div id="err" class="mu"></div><div id="rm" class="mu"></div>${S.sessions.length?`<button onclick="swap(S.sessions[0].id)">Cancel and go back to ${S.sessions[0].id}</button>`:''}</div></div>`;hint()}
const HS={};
const rem=id=>{try{return localStorage.getItem('ag_rem_'+id)===(HS[id]||HASH).slice(0,12)}catch(e){return false}};
function hint(){const e=$('#rm');if(!e)return;e.innerHTML=rem($('#u').value)?'Login saved on this device. Leave password empty and press Sign in. <button onclick="forget()">Forget saved login</button>':'Enter the password once. It is saved on this device after the first login.'}
function addLogin(){S.user=null;loginView()}
function signOut(){S.sessions=S.sessions.filter(s=>s.id!==S.user.id);S.user=S.sessions[0]||null;render()}
function swap(id){S.user=S.sessions.find(s=>s.id===id);const k=A.findIndex(a=>a.id===id);if(k>=0)S.ai=k;S.page='dash';S.param=null;render()}
function forget(){try{localStorage.removeItem('ag_rem_'+$('#u').value)}catch(e){}hint()}
async function login(){const u=USERS.find(x=>x[0]===$('#u').value),pw=$('#p').value.trim();let h='';if(pw)try{h=await sha(pw)}catch(e){$('#err').textContent='Cannot check password here: '+e.message;return}if(!(rem(u[0])&&!pw)&&h!==(HS[u[0]]||HASH)){$('#err').textContent='Password incorrect. Check capital letters and extra spaces, then try again.';S.logins.unshift(now()+' failed '+u[0]);return}try{localStorage.setItem('ag_rem_'+u[0],(HS[u[0]]||HASH).slice(0,12))}catch(e){}
 const at=new Date().toLocaleString(),K='ag_last_'+u[0];let last='First login';try{last=localStorage.getItem(K)||last;localStorage.setItem(K,at)}catch(e){}S.user={id:u[0],role:u[1],at,last};S.sessions=S.sessions.filter(s=>s.id!==u[0]);S.sessions.push(S.user);S.logins.unshift(at+' signed in '+u[0]+' ('+u[1]+')');const k=A.findIndex(a=>a.id===u[0]);if(k>=0)S.ai=k;L('LOGIN',u[0]);S.page='dash';render()}
setInterval(()=>{const e=$('#lt');if(e)e.textContent='Login time: '+new Date().toLocaleString()},1000);seedAll();setSpeed();S.user={id:'PUBLIC',role:'Public viewer',at:'',last:''};S.sessions=[S.user];render();
</script></body></html>
